<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products | ShopNest</title>
  <meta name="description" content="Browse all ShopNest products." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="products">
  <div id="site-header"></div>
  <main>

    <section class="page-head">
      <div class="container">
        <h1>All products</h1>
        <p>Filter by category, sort by price or rating, or use the search bar above.</p>
      </div>
    </section>

    <section class="page-body">
      <div class="container">
        <div class="toolbar">
          <div class="chips" id="category-chips" role="group" aria-label="Filter by category"></div>
          <label class="sort">Sort by
            <select id="sort-select">
              <option value="featured">Featured</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="rating">Top rated</option>
            </select>
          </label>
        </div>
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="product-grid" id="product-grid"></div>

        <div class="empty-state" id="no-results" hidden>
          <div class="empty-icon" aria-hidden="true">🔍</div>
          <h2>No products match your search</h2>
          <p>Try a different word, or clear the filters to see everything.</p>
          <button class="btn btn-primary" id="reset-filters">Clear filters</button>
        </div>
      </div>
    </section>

  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
